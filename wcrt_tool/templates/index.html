<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSN WCRT Analysis Tool</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2d3045;
    --accent: #4f7cff;
    --accent-dim: #2a3f80;
    --text: #e2e4ef;
    --muted: #7a7f99;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --radius: 8px;
    --font: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

  /* ── layout ── */
  .shell { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 24px 20px; display: flex; flex-direction: column; gap: 24px; }
  .main { padding: 32px 36px; overflow-x: auto; }

  /* ── header ── */
  .logo { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  .logo span { color: var(--accent); }
  .subtitle { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ── tabs ── */
  .tabs { display: flex; gap: 4px; background: var(--bg); border-radius: var(--radius); padding: 4px; }
  .tab { flex: 1; padding: 6px 0; border: none; background: none; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; border-radius: 6px; transition: all 0.15s; }
  .tab.active { background: var(--accent-dim); color: var(--accent); }

  /* ── form sections ── */
  .section-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 10px; }
  .panel { display: none; flex-direction: column; gap: 12px; }
  .panel.active { display: flex; }

  /* ── form controls ── */
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  select, input[type="number"], input[type="file"] {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 7px 10px; font-size: 13px;
    outline: none; transition: border-color 0.15s;
  }
  select:focus, input[type="number"]:focus { border-color: var(--accent); }
  input[type="file"] { padding: 6px; cursor: pointer; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ── run button ── */
  .btn-run {
    margin-top: 6px; padding: 10px; background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s; width: 100%;
  }
  .btn-run:hover { opacity: 0.88; }
  .btn-run:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ── main area ── */
  .empty-state { color: var(--muted); text-align: center; margin-top: 120px; font-size: 15px; }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

  .results-header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
  .results-title { font-size: 20px; font-weight: 700; }
  .meta { font-size: 12px; color: var(--muted); }

  .warn-box { background: #2a1f00; border: 1px solid #6b4400; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; font-size: 12px; color: var(--yellow); }

  /* ── table ── */
  .tbl-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { background: var(--surface); color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 9px 14px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, th:nth-child(2) { text-align: left; }
  td { padding: 9px 14px; border-bottom: 1px solid var(--border); text-align: right; color: var(--text); }
  td:first-child, td:nth-child(2) { text-align: left; }
  tr:hover td { background: rgba(79,124,255,0.05); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .badge-A  { background: #1a3060; color: #6aa3ff; }
  .badge-B  { background: #2a1f50; color: #c084fc; }
  .badge-BE { background: #1f2a1a; color: #86efac; }
  .ok  { color: var(--green); font-weight: 600; }
  .bad { color: var(--red);   font-weight: 600; }
  .na  { color: var(--muted); }

  /* ── chart ── */
  .chart-wrap { margin-top: 28px; }
  .chart-wrap img { max-width: 100%; border-radius: var(--radius); border: 1px solid var(--border); background: #fff; }

  /* ── error ── */
  .err-box { background: #2a0f0f; border: 1px solid #7f1f1f; border-radius: var(--radius); padding: 12px 16px; color: var(--red); font-size: 13px; margin-top: 24px; }

  /* ── spinner ── */
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="shell">
  <!-- ── sidebar ── -->
  <aside class="sidebar">

    <div>
      <div class="section-label">Input Source</div>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('builtin')">Built-in</button>
        <button class="tab" onclick="switchTab('upload')">Upload</button>
      </div>
    </div>

    <!-- built-in panel -->
    <div id="panel-builtin" class="panel active">
      <div>
        <label for="test_case">Test Case</label>
        <select id="test_case" name="test_case">
          {% for tc in test_cases %}
          <option value="{{ tc }}">{{ tc }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- upload panel -->
    <div id="panel-upload" class="panel">
      <div>
        <label>topology.json *</label>
        <input type="file" id="topology_file" accept=".json">
      </div>
      <div>
        <label>streams.json *</label>
        <input type="file" id="streams_file" accept=".json">
      </div>
      <div>
        <label>routes.json *</label>
        <input type="file" id="routes_file" accept=".json">
      </div>
      <div>
        <label>WCRTs.csv (optional reference)</label>
        <input type="file" id="reference_file" accept=".csv">
      </div>
    </div>

    <!-- parameters -->
    <div>
      <div class="section-label">Parameters</div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div>
          <label for="mode">Scheduling Mode</label>
          <select id="mode">
            <option value="cbs">CBS (Credit-Based Shaper)</option>
            <option value="sp">SP (Strict Priority)</option>
          </select>
        </div>
        <div>
          <label for="policy">idleSlope Policy</label>
          <select id="policy">
            <option value="fixed">Fixed (uniform α)</option>
            <option value="proportional">Proportional (per-link)</option>
          </select>
        </div>
        <div class="row2">
          <div>
            <label for="alpha_a">α Class A</label>
            <input type="number" id="alpha_a" value="0.5" min="0.01" max="0.99" step="0.01">
          </div>
          <div>
            <label for="alpha_b">α Class B</label>
            <input type="number" id="alpha_b" value="0.5" min="0.01" max="0.99" step="0.01">
          </div>
        </div>
        <div>
          <label for="duration">Sim Duration (μs, blank = auto)</label>
          <input type="number" id="duration" placeholder="e.g. 100000" min="1000" step="1000">
        </div>
      </div>
    </div>

    <button class="btn-run" id="btn-run" onclick="runAnalysis()">Run Analysis</button>
  </aside>

  <!-- ── main ── -->
  <main class="main" id="main">
    <div class="empty-state">
      <div>Select a test case and click <strong>Run Analysis</strong></div>
    </div>
  </main>
</div>

<script>
  let activeTab = "builtin";

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll(".tab").forEach((el, i) => {
      el.classList.toggle("active", (i === 0 && tab === "builtin") || (i === 1 && tab === "upload"));
    });
    document.getElementById("panel-builtin").classList.toggle("active", tab === "builtin");
    document.getElementById("panel-upload").classList.toggle("active", tab === "upload");
  }

  async function runAnalysis() {
    const btn = document.getElementById("btn-run");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Running…';

    const fd = new FormData();
    fd.append("source", activeTab);
    fd.append("mode",   document.getElementById("mode").value);
    fd.append("policy", document.getElementById("policy").value);
    fd.append("alpha_a", document.getElementById("alpha_a").value);
    fd.append("alpha_b", document.getElementById("alpha_b").value);
    fd.append("duration", document.getElementById("duration").value);

    if (activeTab === "builtin") {
      fd.append("test_case", document.getElementById("test_case").value);
    } else {
      const fields = ["topology_file", "streams_file", "routes_file", "reference_file"];
      for (const f of fields) {
        const el = document.getElementById(f);
        if (el.files[0]) fd.append(f, el.files[0]);
      }
    }

    try {
      const resp = await fetch("/run", { method: "POST", body: fd });
      const data = await resp.json();
      renderResults(data);
    } catch (e) {
      renderError("Network error: " + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Run Analysis";
    }
  }

  function renderResults(data) {
    const main = document.getElementById("main");
    if (!data.ok) { renderError(data.error); return; }

    const modeLabel = document.getElementById("mode").options[document.getElementById("mode").selectedIndex].text;
    const hasRef = data.rows.some(r => r.reference !== null);

    let html = `
      <div class="results-header">
        <div class="results-title">${data.case}</div>
        <div class="meta">${data.n_streams} streams &nbsp;·&nbsp; ${data.n_links} links &nbsp;·&nbsp; ${modeLabel}</div>
      </div>`;

    if (data.warnings && data.warnings.length > 0) {
      html += `<div class="warn-box">⚠ ${data.warnings.join("<br>⚠ ")}</div>`;
    }

    html += `<div class="tbl-wrap"><table>
      <thead><tr>
        <th>ID</th><th>Class</th>
        <th>Deadline (μs)</th>
        <th>Analytical (μs)</th>
        <th>Simulated (μs)</th>
        <th>Schedulable</th>
        ${hasRef ? "<th>Reference (μs)</th><th>Δ vs Ref</th>" : ""}
      </tr></thead><tbody>`;

    for (const r of data.rows) {
      const badgeCls = `badge-${r.class}`;
      const ana = r.analytical !== null ? r.analytical.toFixed(3) : '<span class="na">—</span>';
      const sim = r.simulated.toFixed(3);
      let sched = '<span class="na">—</span>';
      if (r.schedulable === true)  sched = '<span class="ok">✓ Yes</span>';
      if (r.schedulable === false) sched = '<span class="bad">✗ No</span>';
      let refCol = "";
      let diffCol = "";
      if (hasRef) {
        refCol = r.reference !== null ? `<td>${r.reference.toFixed(3)}</td>` : `<td class="na">—</td>`;
        if (r.diff_vs_ref !== null) {
          const cls = Math.abs(r.diff_vs_ref) < 0.5 ? "ok" : (r.diff_vs_ref > 0 ? "bad" : "ok");
          diffCol = `<td class="${cls}">${r.diff_vs_ref >= 0 ? "+" : ""}${r.diff_vs_ref.toFixed(3)}</td>`;
        } else {
          diffCol = `<td class="na">—</td>`;
        }
      }
      html += `<tr>
        <td>${r.id}</td>
        <td><span class="badge ${badgeCls}">${r.class}</span></td>
        <td>${r.deadline.toFixed(3)}</td>
        <td>${ana}</td>
        <td>${sim}</td>
        <td>${sched}</td>
        ${refCol}${diffCol}
      </tr>`;
    }

    html += `</tbody></table></div>`;

    if (data.chart) {
      html += `<div class="chart-wrap">
        <img src="data:image/png;base64,${data.chart}" alt="WCRT chart">
      </div>`;
    }

    main.innerHTML = html;
  }

  function renderError(msg) {
    document.getElementById("main").innerHTML =
      `<div class="err-box"><strong>Error:</strong> ${msg}</div>`;
  }
</script>
</body>
</html>
